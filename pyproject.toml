[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mia-exp"
version = "0.1.0"
description = "Experiment harness and benchmark adapters for Roy"
requires-python = ">=3.11"

[project.scripts]
mia-bench = "mia_exp.cli:main"
mia-direct = "mia_exp.direct_cli:main"
mia-evoagent = "mia_exp.evoagent_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mia_exp"]
